// the code is taken from this post: https://reintech.io/blog/custom-drawing-application-html5-canvas-javascript

class DrawingEngine {
  constructor(canvas, ctx) {
    this.canvas = canvas;
    this.ctx = ctx;
    this.isDrawing = false;
    this.lastX = 0;
    this.lastY = 0;

    // Default brush settings
    this.brushColor = "#000000";
    this.brushSize = 25;
    this.brushOpacity = 1;

    this.setupEventListeners();
    this.configureContext();
  }

  configureContext() {
    this.ctx.lineCap = "round";
    this.ctx.lineJoin = "round";
    this.ctx.imageSmoothingEnabled = true;
  }

  setupEventListeners() {
    // Mouse events
    this.canvas.addEventListener("mousedown", (e) => this.startDrawing(e));
    this.canvas.addEventListener("mousemove", (e) => this.draw(e));
    this.canvas.addEventListener("mouseup", () => this.stopDrawing());
    this.canvas.addEventListener("mouseout", () => this.stopDrawing());

    // Touch events for mobile support
    this.canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      this.startDrawing(e.touches[0]);
    });
    this.canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      this.draw(e.touches[0]);
    });
    this.canvas.addEventListener("touchend", () => this.stopDrawing());
  }

  getCoordinates(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
    };
  }

  startDrawing(e) {
    this.isDrawing = true;
    const { x, y } = this.getCoordinates(e);
    this.lastX = x;
    this.lastY = y;

    // Start a new path
    this.ctx.beginPath();
    this.ctx.moveTo(x, y);
    this.ctx.lineTo(x, y);
    // this.ctx.stroke();
  }

  draw(e) {
    if (!this.isDrawing) return;

    const { x, y } = this.getCoordinates(e);

    // Configure stroke style
    this.ctx.strokeStyle = this.brushColor;
    this.ctx.lineWidth = this.brushSize;
    this.ctx.globalAlpha = this.brushOpacity;

    // Draw line segment
    this.ctx.lineTo(x, y);
    this.ctx.stroke();

    // Update last position
    this.lastX = x;
    this.lastY = y;
  }

  stopDrawing() {
    if (this.isDrawing) {
      this.isDrawing = false;
      // this.ctx.closePath();
    }
  }

//  setBrush(color, size, opacity = 1) {
//    this.brushColor = color;
//    this.brushSize = size;
//    this.brushOpacity = opacity;
// }

  clear() {
    const rect = this.canvas.getBoundingClientRect();
    this.ctx.clearRect(0, 0, rect.right, rect.bottom);
  }
}

// main
function get(id) {
  return document.getElementById(id);
}

const ctx = canvas.getContext("2d", { willReadFrequently: false });

const dpr = window.devicePixelRatio || 1;

canvas.width = rect.width * dpr;
canvas.height = rect.height * dpr;

ctx.scale(dpr, dpr);

canvas.style.width = `${rect.width}px`;
canvas.style.height = `${rect.height}px`;

// drawing
